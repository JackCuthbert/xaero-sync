# Project tooling. Install mise first, then run `mise install` in this directory.

[tools]
gradle = "9.7.1"
java = "25.0.2"

[tasks.doctor]
description = "Show the active JDK and Gradle wrapper versions"
run = [
  "java --version",
  "gradle --version",
]

[tasks.build]
description = "Compile all modules and create distributable JARs"
run = "gradle build"

[tasks.test]
description = "Run all automated tests"
run = "gradle test"

[tasks.check]
description = "Run verification checks and tests"
run = "gradle check"

[tasks.format]
description = "Apply the Kotlin formatter to source and Gradle Kotlin files"
run = "gradle ktlintFormat"

[tasks.lint]
description = "Check Kotlin formatting and lint rules"
run = "gradle ktlintCheck"

[tasks.clean]
description = "Remove Gradle build outputs"
run = "gradle clean"

[tasks.verify]
description = "Build both artifacts and run every required verification check"
run = "gradle build"

[tasks.copy-paper-plugin]
description = "Build and install the Paper plugin into the local development server"
depends = ["build"]
run = "cp packages/paper-plugin/build/libs/xaero-sync-paper-26.2-0.1.0-SNAPSHOT.jar dev/paper-server/plugins/xaero-sync-paper-26.2-0.1.0-SNAPSHOT.jar"

[tasks.copy-client-mod]
description = "Build and install the Fabric client mod into XAERO_SYNC_PRISM_MODS_DIR"
depends = ["build"]
run = "test -n \"$XAERO_SYNC_PRISM_MODS_DIR\" && test -d \"$XAERO_SYNC_PRISM_MODS_DIR\" && cp packages/fabric-client/build/libs/xaero-sync-fabric-26.2-0.1.0-SNAPSHOT.jar \"$XAERO_SYNC_PRISM_MODS_DIR/xaero-sync-fabric-26.2-0.1.0-SNAPSHOT.jar\""

[tasks.paper]
description = "Start the local Paper 26.2 build-121 compatibility server"
depends = ["copy-paper-plugin"]
dir = "{{config_root}}/dev/paper-server"
run = "java -jar paper-26.2-121.jar --nogui"
