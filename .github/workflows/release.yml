name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v6

      - name: Install toolchain
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: jdx/mise-action@v4

      - name: Verify release artifacts
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: mise run verify

      - name: Attach artifacts to GitHub release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          fabric_jar="packages/fabric-client/build/libs/xaero-sync-fabric-26.2-${RELEASE_VERSION}.jar"
          paper_jar="packages/paper-plugin/build/libs/xaero-sync-paper-26.2-${RELEASE_VERSION}.jar"
          test -f "$fabric_jar"
          test -f "$paper_jar"
          gh release upload "$RELEASE_TAG" "$fabric_jar" "$paper_jar" --clobber
